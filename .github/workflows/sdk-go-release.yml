name: sdk-go-release

# The Go runtime is a module in this repo: the tag sdk/go/vX.Y.Z is the release. This checks the module at
# that tag (gofmt, vet, the end-to-end test against keel serve) and asks the Go module proxy for it, so
# `go get github.com/angelkurten/keel/sdk/go@vX.Y.Z` works at once.
on:
  push:
    tags: ["sdk/go/v*"]

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - run: uv sync --extra dev
      - run: uv run keel sdk go cartridges/fleet -o sdk/go/fleet/keel_fleet.go --package fleet --check
      - run: test -z "$(gofmt -l .)" && go vet ./... && go test ./...
        working-directory: sdk/go
      - name: publish to the module proxy
        run: |
          v="${GITHUB_REF_NAME#sdk/go/}"
          for i in $(seq 10); do
            GOPROXY=https://proxy.golang.org go list -m "github.com/angelkurten/keel/sdk/go@$v" && exit 0
            sleep 15
          done
          exit 1
