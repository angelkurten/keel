name: sdk-typescript-release

# Publishes @keel-context/sdk to npm with trusted publishing (OIDC: no token stored here, provenance
# signed automatically) when a sdk/typescript/vX.Y.Z tag is pushed.
# One-time setup on npmjs.com: package @keel-context/sdk > Settings > Trusted Publisher > GitHub Actions,
# organization or user angelkurten, repository keel, workflow filename sdk-typescript-release.yml.
on:
  push:
    tags: ["sdk/typescript/v*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  npm:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/typescript
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - name: npm with trusted publishing (11.5.1 or later)
        run: npm install -g npm@latest && npm --version
      - name: the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF#refs/tags/sdk/typescript/v}"
          pkg="$(node -p "require('./package.json').version")"
          test "$tag" = "$pkg" || { echo "tag $tag != package.json $pkg"; exit 1; }
      - run: uv sync --extra dev
        working-directory: .
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - run: npm publish --access public
