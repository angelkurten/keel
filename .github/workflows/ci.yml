name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --extra dev
      - run: uv run ruff check .
      - run: uv run pytest -q
      - name: every cartridge validates against its stream
        run: |
          for c in fleet crm finance clinics; do
            uv run keel validate cartridges/$c --events examples/events/$c.jsonl
          done
      - run: uv run python examples/agent_minimal.py

  store-mysql:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: keel
          MYSQL_DATABASE: keel
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -pkeel --silent"
          --health-interval 5s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --extra dev --extra mysql
      - run: KEEL_MYSQL_URL=mysql://root:keel@127.0.0.1:3306/keel uv run pytest -q tests/test_store.py

  semantic-chroma:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --extra dev --extra chroma
      - run: uv run pytest -q tests/test_semantic.py

  sdk-typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: oven-sh/setup-bun@v2
      - run: uv sync --extra dev
      - name: generated clients are fresh
        run: |
          uv run keel sdk typescript cartridges/fleet -o sdk/typescript/test/keel-fleet.ts --check
          uv run keel sdk typescript cartridges/finance -o sdk/typescript/test/keel-finance.ts --check
      - run: bun install --frozen-lockfile
        working-directory: sdk/typescript
      - run: bun run typecheck
        working-directory: sdk/typescript
      - run: bun test
        working-directory: sdk/typescript

  sdk-go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - run: uv sync --extra dev
      - run: uv run keel sdk go cartridges/fleet -o sdk/go/fleet/keel_fleet.go --package fleet --check
      - run: test -z "$(gofmt -l .)" && go vet ./... && go test ./...
        working-directory: sdk/go

  sdk-php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
      - run: uv sync --extra dev
      - run: uv run keel sdk php cartridges/fleet -o sdk/php/test/KeelFleet.php --check
      - run: php -l sdk/php/test/KeelFleet.php && bash sdk/php/test/run.sh

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t keel:local .
      - run: deploy/smoke.sh keel:local
      - run: docker build --build-arg KEEL_EXTRAS=http2,mysql -t keel:slim .
      - run: deploy/smoke.sh keel:slim
