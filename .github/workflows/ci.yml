name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --extra dev
      - run: uv run ruff check .
      - run: uv run pytest -q
      - name: every cartridge validates against its stream
        run: |
          for c in fleet crm finance clinics; do
            uv run keel validate cartridges/$c --events examples/events/$c.jsonl
          done
      - run: uv run python examples/agent_minimal.py
