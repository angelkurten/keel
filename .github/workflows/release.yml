name: release

# Publishes to PyPI with trusted publishing (no token stored here) when a v* tag is pushed.
# One-time setup on PyPI: add a pending publisher for project keel-context, owner angelkurten,
# repository keel, workflow release.yml, environment pypi.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pypi:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --extra dev
      - run: uv run pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci && npm run build:wheel  # the console, into keel/console/, shipped in the wheel
        working-directory: console
      - run: uv build
      - uses: pypa/gh-action-pypi-publish@release/v1
