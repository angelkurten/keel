[project]
name = "keel-context"
version = "0.34.0"
description = "Context layer for the AI agents in a product (a SaaS, a consumer app, an internal tool): domain events in, a per-tenant bitemporal context graph out, shared by every agent through five MCP tools."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [{ name = "Angel Kürten", email = "angel@angelkurten.com" }]
keywords = ["agents", "context", "knowledge-graph", "event-driven", "mcp", "bitemporal"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Libraries",
]
dependencies = [
  "pydantic>=2.6",
  "pyyaml>=6.0",
  "typer>=0.12",
]

[project.optional-dependencies]
mcp = ["mcp>=1.2"]
postgres = ["psycopg[binary]>=3.1"]
webhook = ["fastapi>=0.110", "uvicorn>=0.27"]
http = ["fastapi>=0.110", "uvicorn>=0.27", "mcp>=1.2"]
http2 = ["fastapi>=0.110", "hypercorn>=0.17", "mcp>=1.2"]
kafka = ["confluent-kafka>=2.3"]
sqs = ["boto3>=1.34"]
mysql = ["pymysql>=1.1"]
duckdb = ["duckdb>=1.1"]
chroma = ["chromadb>=1.0; python_version >= '3.11'"]
weaviate = ["weaviate-client>=4.16"]
docs = ["mkdocs-material>=9.5", "mkdocs<2"]
dev = ["pytest>=8.0", "ruff>=0.5", "mcp>=1.2", "fastapi>=0.110", "httpx>=0.27", "uvicorn>=0.27", "hypercorn>=0.17", "jsonschema>=4", "duckdb>=1.1"]

[project.scripts]
keel = "keel.cli:app"
keel-context = "keel.cli:app"  # the package name, so `uvx keel-context ...` (MCP registry clients) finds a command

[project.urls]
Homepage = "https://github.com/angelkurten/keel"
Documentation = "https://angelkurten.github.io/keel/"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
artifacts = ["keel/console/**"]  # the console's build (gitignored), in the sdist and the wheel: release.yml builds it before `uv build`

[tool.hatch.build.targets.wheel]
packages = ["keel"]

[tool.hatch.build.targets.wheel.force-include]  # for `keel init --example`, so a pip install has data to try
"examples/fleet" = "keel/examples/fleet"
"examples/crm" = "keel/examples/crm"
"examples/clinics" = "keel/examples/clinics"
"examples/finance" = "keel/examples/finance"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Argument", "typer.Option"]

[tool.pytest.ini_options]
testpaths = ["tests", "examples"]
