[project]
name = "keel-context"
version = "0.15.0"
description = "Context layer for AI agents in vertical SaaS: domain events in, a per-tenant bitemporal context graph out, shared by every agent through five MCP tools."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [{ name = "Angel Kürten", email = "angel@angelkurten.com" }]
keywords = ["agents", "context", "knowledge-graph", "event-driven", "mcp", "bitemporal"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Libraries",
]
dependencies = [
  "pydantic>=2.6",
  "pyyaml>=6.0",
  "typer>=0.12",
]

[project.optional-dependencies]
mcp = ["mcp>=1.2"]
postgres = ["psycopg[binary]>=3.1"]
webhook = ["fastapi>=0.110", "uvicorn>=0.27"]
http = ["fastapi>=0.110", "uvicorn>=0.27", "mcp>=1.2"]
kafka = ["confluent-kafka>=2.3"]
sqs = ["boto3>=1.34"]
mysql = ["pymysql>=1.1"]
chroma = ["chromadb>=1.0; python_version >= '3.11'"]
docs = ["mkdocs-material>=9.5", "mkdocs<2"]
graphiti = ["graphiti-core>=0.5"]
dev = ["pytest>=8.0", "ruff>=0.5", "mcp>=1.2", "fastapi>=0.110", "httpx>=0.27", "uvicorn>=0.27"]

[project.scripts]
keel = "keel.cli:app"

[project.urls]
Homepage = "https://github.com/angelkurten/keel"
Documentation = "https://angelkurten.github.io/keel/"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["keel"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Argument", "typer.Option"]

[tool.pytest.ini_options]
testpaths = ["tests"]
