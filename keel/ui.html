<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Keel Browser</title>
<link rel="icon" href="data:,">
<style>
:root { --bg:#fafaf9; --fg:#1c1917; --muted:#78716c; --line:#e7e5e4; --card:#fff; --accent:#0f766e; --warn:#b45309; --graph-bg:#f5f5f4; --node:#57534e; --edge:#d6d3d1; }
@media (prefers-color-scheme: dark) { :root { --bg:#1c1917; --fg:#f5f5f4; --muted:#a8a29e; --line:#44403c; --card:#292524; --accent:#2dd4bf; --warn:#fbbf24; --graph-bg:#1e1e1e; --node:#d4d4d4; --edge:#4a4a4a; } }
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.45 system-ui, sans-serif; }
header { display:flex; flex-wrap:wrap; gap:8px; align-items:center; padding:12px 16px; border-bottom:1px solid var(--line); }
header b { margin-right:8px; }
input, button, select { font:inherit; color:inherit; background:var(--card); border:1px solid var(--line); border-radius:6px; padding:5px 8px; }
button { cursor:pointer; }
main { display:grid; grid-template-columns:280px 1fr; gap:16px; padding:16px; }
@media (max-width:800px) { main { grid-template-columns:1fr; } }
section { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:12px; min-width:0; }
h2 { font-size:13px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); margin:0 0 8px; }
ul { list-style:none; margin:0; padding:0; }
li a, .link { color:var(--accent); cursor:pointer; text-decoration:none; }
li { padding:3px 0; overflow-wrap:anywhere; }
table { border-collapse:collapse; width:100%; }
td, th { text-align:left; padding:4px 6px; border-bottom:1px solid var(--line); vertical-align:top; overflow-wrap:anywhere; }
th { color:var(--muted); font-weight:500; }
.muted { color:var(--muted); }
.err { color:var(--warn); white-space:pre-wrap; }
.tag { display:inline-block; padding:0 6px; border-radius:10px; border:1px solid var(--line); margin:0 4px 4px 0; }
.tag.on { border-color:var(--warn); color:var(--warn); }
.graph { position:relative; height:560px; border-radius:6px; overflow:hidden; background:var(--graph-bg); }
.graph canvas { display:block; width:100%; height:100%; cursor:grab; touch-action:none; }
.graph canvas.drag { cursor:grabbing; }
.graph .panel { position:absolute; top:10px; right:10px; width:210px; display:flex; flex-direction:column; gap:6px; padding:10px;
  background:color-mix(in srgb, var(--card) 88%, transparent); backdrop-filter:blur(6px); border:1px solid var(--line); border-radius:8px; font-size:12px; }
.graph .panel label { display:flex; align-items:center; justify-content:space-between; gap:8px; color:var(--muted); }
.graph .panel input[type=search] { width:100%; }
.graph .panel .row { display:flex; gap:6px; }
.graph .panel .row button { flex:1; }
.graph .count { position:absolute; left:10px; bottom:8px; font-size:11px; color:var(--muted); pointer-events:none; }
@media (max-width:800px) { .graph { height:420px; } .graph .panel { width:170px; } }
.stack > * + * { margin-top:16px; }
</style>
</head>
<body>
<header>
  <b>Keel</b>
  <input id="secret" type="password" placeholder="secret" autocomplete="off">
  <input id="tenant" placeholder="tenant">
  <input id="agent" placeholder="agent (optional)">
  <label class="muted">as of <input id="asof" type="datetime-local"></label>
</header>
<main>
  <section>
    <h2>Search</h2>
    <form id="sf"><input id="q" placeholder="text or kind:id" style="width:100%"></form>
    <p id="serr" class="err"></p>
    <ul id="results"></ul>
  </section>
  <div class="stack">
    <section><h2 id="title">Pick a subject</h2><div id="entity" class="muted">Search on the left, or type a subject key.</div></section>
    <section><h2>Graph</h2><div id="graph" class="muted">-</div></section>
    <section><h2>Facts</h2><div id="facts" class="muted">-</div></section>
    <section><h2 id="htitle">History</h2><div id="history" class="muted">Click a predicate to see its history.</div></section>
  </div>
</main>
<script>
const $ = (id) => document.getElementById(id);
const el = (tag, attrs = {}, ...kids) => {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) k.startsWith("on") ? n.addEventListener(k.slice(2), v) : n.setAttribute(k, v);
  for (const k of kids) n.append(k instanceof Node ? k : document.createTextNode(String(k)));
  return n;
};
const show = (v) => v === null || v === undefined ? "" : typeof v === "object" ? JSON.stringify(v) : String(v);
const day = (s) => s ? s.replace("T", " ").slice(0, 16) : "";

// Per-tab only: the secret never outlives the tab.
for (const k of ["secret", "tenant", "agent"]) {
  try { $(k).value = sessionStorage.getItem("keel." + k) || ""; } catch {}
  $(k).addEventListener("change", () => { try { sessionStorage.setItem("keel." + k, $(k).value); } catch {} });
}

async function call(tool, body) {
  const headers = { "Content-Type": "application/json", "X-Keel-Tenant": $("tenant").value.trim() };
  if ($("secret").value) headers.Authorization = "Bearer " + $("secret").value;
  if ($("agent").value.trim()) headers["X-Keel-Agent"] = $("agent").value.trim();
  const res = await fetch("v1/" + tool, { method: "POST", headers, body: JSON.stringify(body) });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(`${res.status}: ${show(data.detail ?? res.statusText)}`);
  return data;
}
const asOf = () => $("asof").value ? new Date($("asof").value).toISOString() : null;

$("sf").addEventListener("submit", async (e) => {
  e.preventDefault();
  const q = $("q").value.trim();
  $("serr").textContent = ""; $("results").replaceChildren();
  if (/^[\w.-]+:\S+$/.test(q)) return open(q);
  try {
    const hits = await call("search", { text: q, limit: 50, as_of: asOf() });
    if (!hits.length) $("results").append(el("li", { class: "muted" }, "No match."));
    for (const h of hits) $("results").append(el("li", {}, el("a", { onclick: () => open(h.key) }, h.key), " ", el("span", { class: "muted" }, h.attrs ? Object.values(h.attrs).map(show).join(" · ") : "")));
  } catch (err) { $("serr").textContent = err.message; }
});

async function open(subject, fromGraph = false) {
  $("title").textContent = subject;
  fromGraph ? graph.expand(subject) : graph.show(subject);
  $("history").replaceChildren(el("span", { class: "muted" }, "Click a predicate to see its history."));
  $("htitle").textContent = "History";
  try {
    const ctx = await call("context", { subject, as_of: asOf() });
    renderEntity(ctx); renderFacts(subject, ctx.facts || []);
  } catch (err) {
    $("entity").replaceChildren(el("span", { class: "err" }, err.message));
    $("facts").replaceChildren();
  }
}

function renderEntity(ctx) {
  const e = ctx.entity || {}, box = el("div");
  if (e.ref) box.append(el("div", { class: "muted" }, "ref " + e.ref));
  const attrs = el("div");
  for (const [k, v] of Object.entries(e.attrs || {})) attrs.append(el("span", { class: "tag" }, `${k}: ${show(v)}`));
  const rules = el("div");
  for (const [k, v] of Object.entries(ctx.evaluation || {})) rules.append(el("span", { class: v ? "tag on" : "tag" }, `${k}: ${show(v)}`));
  box.append(attrs, rules);
  $("entity").replaceChildren(box);
}

function renderFacts(subject, facts) {
  if (!facts.length) return $("facts").replaceChildren(el("span", { class: "muted" }, "No current facts."));
  const t = el("table", {}, el("tr", {}, ...["predicate", "value", "since", "scope", "source"].map((h) => el("th", {}, h))));
  for (const f of facts) t.append(el("tr", {},
    el("td", {}, el("a", { class: "link", onclick: () => history(subject, f.predicate) }, f.predicate)),
    el("td", {}, show(f.value)), el("td", {}, day(f.valid_from)), el("td", {}, f.scope || ""),
    el("td", {}, f.corrected_by ? `${f.source} (by ${f.corrected_by})` : f.source || "")));
  $("facts").replaceChildren(t);
}

async function history(subject, predicate) {
  $("htitle").textContent = "History: " + predicate;
  try {
    const rows = await call("history", { subject, predicate });
    const t = el("table", {}, el("tr", {}, ...["value", "valid from", "valid to", "recorded", "source", "evidence"].map((h) => el("th", {}, h))));
    for (const f of rows) t.append(el("tr", {}, el("td", {}, show(f.value)), el("td", {}, day(f.valid_from)), el("td", {}, day(f.valid_to) || "now"),
      el("td", {}, day(f.recorded_at)), el("td", {}, f.source || ""), el("td", { class: "muted" }, show(f.evidence))));
    $("history").replaceChildren(t);
  } catch (err) { $("history").replaceChildren(el("span", { class: "err" }, err.message)); }
}

// The graph: a force layout on a canvas, in the spirit of Obsidian's graph view. It starts from the subject at
// the chosen depth (related depth 1-3, a tree: each subject once) and grows as you click: a click opens a node
// and adds all of its own neighbours, cross links included. Node size follows its links; labels fade in with zoom.
// ponytail: repulsion on a spatial grid (only nearby nodes push), so a few thousand nodes stay fluid; Barnes-Hut if
// someone needs tens of thousands. Capped at MAX nodes.
const graph = (() => {
  const MAX = 3000, CELL = 90;
  let nodes = new Map(), links = new Map(), center = null, hover = null, alpha = 0, raf = 0, colors = {}, gen = 0;
  const view = { x: 0, y: 0, k: 1 }, ui = {};
  let canvas, ctx2, W = 0, H = 0;

  function build() {
    canvas = el("canvas", { tabindex: 0, role: "img", "aria-label": "Graph of the subject's neighbours: click a node to open it" });
    ui.depth = el("select", {}, ...[1, 2, 3].map((d) => el("option", { value: d }, d === 1 ? "1 hop" : `${d} hops`)));
    ui.filter = el("input", { type: "search", placeholder: "highlight…" });
    ui.labels = el("input", { type: "checkbox" });
    ui.count = el("div", { class: "count" });
    ui.depth.value = 2;
    ui.depth.addEventListener("change", () => center && show(center));
    ui.filter.addEventListener("input", wake);
    ui.labels.addEventListener("change", wake);
    const panel = el("div", { class: "panel" },
      el("label", {}, "Depth", ui.depth), ui.filter, el("label", {}, "All labels", ui.labels),
      el("div", { class: "row" }, el("button", { onclick: fit }, "Fit"), el("button", { onclick: () => center && show(center) }, "Reset")));
    const box = el("div", { class: "graph" }, canvas, panel, ui.count);
    $("graph").classList.remove("muted");
    $("graph").replaceChildren(box);
    ctx2 = canvas.getContext("2d");
    new ResizeObserver(() => { resize(); wake(); }).observe(box);
    matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => { readColors(); wake(); });
    readColors(); resize(); interact();
  }
  function readColors() {
    const cs = getComputedStyle(document.documentElement);
    for (const k of ["graph-bg", "node", "edge", "accent", "fg", "muted", "warn"]) colors[k] = cs.getPropertyValue("--" + k).trim();
  }
  function resize() {
    const r = canvas.getBoundingClientRect(), dpr = devicePixelRatio || 1;
    W = r.width; H = r.height; canvas.width = W * dpr; canvas.height = H * dpr;
    ctx2.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function node(id, near) {
    let n = nodes.get(id);
    if (!n && nodes.size < MAX) {
      const a = Math.random() * 2 * Math.PI, d = near ? 20 + Math.random() * 30 : 0;
      n = { id, x: (near ? near.x : 0) + d * Math.cos(a), y: (near ? near.y : 0) + d * Math.sin(a), vx: 0, vy: 0, deg: 0 };
      nodes.set(id, n);
    }
    return n;
  }
  function link(a, b, rel) {
    const key = a < b ? `${a}\u0000${b}\u0000${rel}` : `${b}\u0000${a}\u0000${rel}`;
    if (links.has(key) || !nodes.has(a) || !nodes.has(b)) return;
    links.set(key, { s: nodes.get(a), t: nodes.get(b), rel });
    nodes.get(a).deg++; nodes.get(b).deg++;
  }
  async function add(subject, depth, heat) {
    const mine = gen, rows = await call("related", { subject, depth, as_of: asOf() });
    if (mine !== gen) return;  // a newer show() started meanwhile: this answer belongs to the old graph
    node(subject, null);
    for (const r of rows) {
      const from = r.via || subject, n = node(r.subject, nodes.get(from));
      if (n) r.direction === "in" ? link(r.subject, from, r.relation) : link(from, r.subject, r.relation);
    }
    count(); wake(heat);
  }
  async function show(subject) {
    if (!canvas) build();
    nodes = new Map(); links = new Map(); center = subject; hover = null; gen++;
    Object.assign(view, { x: 0, y: 0, k: 1 });
    try { await add(subject, +ui.depth.value, 1); setTimeout(fit, 900); }
    catch (err) { ui.count.textContent = err.message; }
  }
  async function expand(subject) {
    if (!canvas || !nodes.has(subject)) return show(subject);
    center = subject;
    try { await add(subject, 1, 0.3); } catch (err) { ui.count.textContent = err.message; }  // a gentle reheat: the rest stays put
  }
  function count() {
    ui.count.textContent = `${nodes.size} nodes · ${links.size} links` + (nodes.size >= MAX ? ` (capped at ${MAX})` : "");
  }

  function tick() {
    const list = [...nodes.values()], grid = new Map();
    for (const n of list) {
      const k = `${Math.floor(n.x / CELL)},${Math.floor(n.y / CELL)}`;
      (grid.get(k) || grid.set(k, []).get(k)).push(n);
    }
    for (const n of list) {
      const gx = Math.floor(n.x / CELL), gy = Math.floor(n.y / CELL);
      for (let i = -1; i <= 1; i++) for (let j = -1; j <= 1; j++) for (const m of grid.get(`${gx + i},${gy + j}`) || []) {
        if (m === n) continue;
        let dx = n.x - m.x, dy = n.y - m.y, d2 = dx * dx + dy * dy;
        if (d2 > CELL * CELL) continue;
        if (d2 < 1) { dx = Math.random() - 0.5; dy = Math.random() - 0.5; d2 = 1; }
        const f = 260 / d2;
        n.vx += dx * f * alpha; n.vy += dy * f * alpha;
      }
      n.vx -= n.x * 0.006 * alpha; n.vy -= n.y * 0.006 * alpha;  // gravity to the centre
    }
    for (const { s: a, t: b } of links.values()) {
      const dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy) || 1;
      const f = ((d - 46) / d) * 0.08 * alpha, wa = b.deg / (a.deg + b.deg);  // the lighter end moves more
      a.vx += dx * f * wa; a.vy += dy * f * wa; b.vx -= dx * f * (1 - wa); b.vy -= dy * f * (1 - wa);
    }
    for (const n of list) {
      if (n.fx !== undefined) { n.x = n.fx; n.y = n.fy; n.vx = n.vy = 0; continue; }
      n.vx *= 0.6; n.vy *= 0.6; n.x += n.vx; n.y += n.vy;
    }
    alpha *= 0.985;
  }

  const radius = (n) => 2.5 + Math.sqrt(n.deg) * 1.3;
  const screen = (n) => [n.x * view.k + view.x + W / 2, n.y * view.k + view.y + H / 2];
  function neighbours(n) {
    const out = new Set([n]);
    for (const l of links.values()) if (l.s === n) out.add(l.t); else if (l.t === n) out.add(l.s);
    return out;
  }
  function draw() {
    const q = ui.filter.value.trim().toLowerCase(), lit = hover ? neighbours(hover) : null;
    const match = (n) => q && n.id.toLowerCase().includes(q);
    const dim = (n) => (lit && !lit.has(n)) || (q && !match(n) && !lit);
    ctx2.fillStyle = colors["graph-bg"]; ctx2.fillRect(0, 0, W, H);
    ctx2.save();
    ctx2.translate(W / 2 + view.x, H / 2 + view.y); ctx2.scale(view.k, view.k);
    ctx2.lineWidth = 0.8 / view.k;
    for (const l of links.values()) {
      const on = lit && lit.has(l.s) && lit.has(l.t) && (l.s === hover || l.t === hover);
      ctx2.strokeStyle = on ? colors.accent : colors.edge;
      ctx2.globalAlpha = on ? 0.9 : dim(l.s) || dim(l.t) ? 0.15 : 0.7;
      ctx2.beginPath(); ctx2.moveTo(l.s.x, l.s.y); ctx2.lineTo(l.t.x, l.t.y); ctx2.stroke();
    }
    for (const n of nodes.values()) {
      ctx2.globalAlpha = dim(n) ? 0.18 : 1;
      ctx2.fillStyle = n.id === center ? colors.accent : match(n) ? colors.warn : n === hover ? colors.accent : colors.node;
      ctx2.beginPath(); ctx2.arc(n.x, n.y, radius(n), 0, 2 * Math.PI); ctx2.fill();
    }
    ctx2.restore();
    // labels in screen space, so they stay legible; they fade in from zoom 0.9 to 1.6, like Obsidian's text fade
    const fade = ui.labels.checked ? 1 : Math.max(0, Math.min(1, (view.k - 0.9) / 0.7));
    ctx2.font = "11px system-ui, sans-serif"; ctx2.textAlign = "center"; ctx2.textBaseline = "top";
    for (const n of nodes.values()) {
      const always = n.id === center || n === hover || (lit && lit.has(n)) || match(n);
      const a = always ? 1 : dim(n) ? 0 : fade * (n.deg > 3 ? 1 : 0.75);
      if (a < 0.05) continue;
      const [x, y] = screen(n);
      if (x < -100 || x > W + 100 || y < -20 || y > H + 20) continue;
      ctx2.globalAlpha = a; ctx2.fillStyle = always ? colors.fg : colors.muted;
      ctx2.fillText(n.id.length > 40 ? "…" + n.id.slice(-39) : n.id, x, y + radius(n) * view.k + 3);
    }
    ctx2.globalAlpha = 1;
  }
  function frame() {
    raf = 0;
    if (alpha > 0.004) tick();
    draw();
    if (alpha > 0.004) raf = requestAnimationFrame(frame);
  }
  function wake(heat) {
    if (heat) alpha = Math.max(alpha, heat);
    if (!raf && canvas) raf = requestAnimationFrame(frame);
  }
  function fit() {
    if (!nodes.size) return;
    let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
    for (const n of nodes.values()) { x0 = Math.min(x0, n.x); y0 = Math.min(y0, n.y); x1 = Math.max(x1, n.x); y1 = Math.max(y1, n.y); }
    view.k = Math.min(2.5, 0.9 * Math.min(W / (x1 - x0 || 1), H / (y1 - y0 || 1)));
    view.x = -((x0 + x1) / 2) * view.k; view.y = -((y0 + y1) / 2) * view.k;
    wake();
  }

  function at(ev) {
    const r = canvas.getBoundingClientRect(), x = ev.clientX - r.left, y = ev.clientY - r.top;
    let best = null, bd = Infinity;
    for (const n of nodes.values()) {
      const [sx, sy] = screen(n), d = Math.hypot(sx - x, sy - y);
      if (d < Math.max(8, radius(n) * view.k + 4) && d < bd) { best = n; bd = d; }
    }
    return { best, x, y };
  }
  function interact() {
    let down = null;
    canvas.addEventListener("pointerdown", (ev) => {
      const { best, x, y } = at(ev);
      down = { node: best, x, y, vx: view.x, vy: view.y, moved: false };
      canvas.setPointerCapture(ev.pointerId); canvas.classList.add("drag");
    });
    canvas.addEventListener("pointermove", (ev) => {
      const { best, x, y } = at(ev);
      if (!down) { if (best !== hover) { hover = best; canvas.style.cursor = best ? "pointer" : ""; wake(); } return; }
      if (Math.hypot(x - down.x, y - down.y) > 3) down.moved = true;
      if (down.node) {
        down.node.fx = (x - W / 2 - view.x) / view.k; down.node.fy = (y - H / 2 - view.y) / view.k;
        wake(0.3);
      } else { view.x = down.vx + x - down.x; view.y = down.vy + y - down.y; wake(); }
    });
    const up = () => {
      if (down?.node) {
        delete down.node.fx; delete down.node.fy;
        if (!down.moved) open(down.node.id, true);
      }
      down = null; canvas.classList.remove("drag");
    };
    canvas.addEventListener("pointerup", up);
    canvas.addEventListener("pointercancel", up);
    canvas.addEventListener("pointerleave", () => { if (!down && hover) { hover = null; wake(); } });
    canvas.addEventListener("wheel", (ev) => {
      ev.preventDefault();
      const r = canvas.getBoundingClientRect(), x = ev.clientX - r.left - W / 2, y = ev.clientY - r.top - H / 2;
      const k = Math.max(0.1, Math.min(8, view.k * Math.exp(-ev.deltaY * (ev.ctrlKey ? 0.01 : 0.0015))));
      view.x = x - ((x - view.x) * k) / view.k; view.y = y - ((y - view.y) * k) / view.k; view.k = k;
      wake();
    }, { passive: false });
    canvas.addEventListener("dblclick", fit);
    canvas.addEventListener("keydown", (ev) => {  // keyboard: arrows pan, +/- zoom, f fits
      const step = 40, keys = { ArrowLeft: [step, 0], ArrowRight: [-step, 0], ArrowUp: [0, step], ArrowDown: [0, -step] };
      if (keys[ev.key]) { view.x += keys[ev.key][0]; view.y += keys[ev.key][1]; }
      else if (ev.key === "+" || ev.key === "=") view.k = Math.min(8, view.k * 1.2);
      else if (ev.key === "-") view.k = Math.max(0.1, view.k / 1.2);
      else if (ev.key === "f") fit();
      else return;
      ev.preventDefault(); wake();
    });
  }
  return { show, expand };
})();

$("asof").addEventListener("change", () => { const s = $("title").textContent; if (s.includes(":")) open(s); });
</script>
</body>
</html>
